name: Add homepage experience gallery

on:
  push:
    paths:
      - '.github/workflows/add-home-experience.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build optimized event photos
        run: |
          cat .tmp/g1_00.b64 .tmp/g1_01.b64 .tmp/g1_02.b64 .tmp/g1_03.b64 .tmp/g1_04.b64 .tmp/g1_05.b64 | tr -d '\n\r' | base64 -d > assets/guest-experience-chef.webp
          cat .tmp/g2_00.b64 .tmp/g2_01.b64 .tmp/g2_02.b64 .tmp/g2_03.b64 | tr -d '\n\r' | base64 -d > assets/guest-experience-party.webp
          test -s assets/guest-experience-chef.webp
          test -s assets/guest-experience-party.webp
          file assets/guest-experience-chef.webp assets/guest-experience-party.webp

      - name: Add experience section and fix homepage copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          bad='From booking to your backyard, we make private mobile hibachi simple for From booking to your backyard, we make private mobile hibachi simple.'
          s=s.replace(bad,'From booking to your backyard, we make private mobile hibachi simple.')

          css='''\n.guestExperience{background:linear-gradient(180deg,#080706 0%,#0d0b09 52%,#080706 100%);border-top:1px solid rgba(217,171,74,.18);padding:46px 20px 50px}\n.guestExperienceWrap{max-width:980px;margin:0 auto;text-align:center}\n.guestExperienceEyebrow{margin:0 0 8px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.18em}\n.guestExperienceTitle{margin:0;color:#fff;font:700 32px/1.08 Georgia,serif}\n.guestExperienceIntro{margin:11px auto 24px;max-width:640px;color:var(--muted);font-size:14px;line-height:1.6}\n.guestExperienceGrid{display:grid;grid-template-columns:1fr;gap:16px;text-align:left}\n.guestExperienceCard{overflow:hidden;border:1px solid rgba(217,171,74,.42);border-radius:16px;background:linear-gradient(180deg,#15120f,#0d0b09);box-shadow:0 16px 38px rgba(0,0,0,.25)}\n.guestExperienceCard img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#0b0a08}\n.guestExperienceCard:first-child img{object-position:center 44%}\n.guestExperienceCard:last-child img{object-position:center 42%}\n.guestExperienceBody{padding:18px 18px 20px}\n.guestExperienceStars{color:var(--gold2);font-size:15px;letter-spacing:3px;line-height:1;margin-bottom:12px}\n.guestExperienceLabel{margin:0 0 7px;color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.16em}\n.guestExperienceBody h3{margin:0;color:#fff;font:700 21px/1.15 Georgia,serif}\n.guestExperienceBody p:last-child{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}\n@media(min-width:760px){.guestExperience{padding:60px 28px 66px}.guestExperienceTitle{font-size:42px}.guestExperienceIntro{font-size:16px;margin-bottom:30px}.guestExperienceGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.guestExperienceCard img{aspect-ratio:4/3}.guestExperienceBody{padding:22px 22px 24px}.guestExperienceBody h3{font-size:24px}.guestExperienceBody p:last-child{font-size:14px}}\n'''
          if '.guestExperience{' not in s:
              assert '\n.how{' in s, 'How It Works CSS anchor not found'
              s=s.replace('\n.how{',css+'\n.how{',1)

          module='''\n<section class="guestExperience" id="guest-experience" aria-labelledby="guest-experience-title">\n  <div class="guestExperienceWrap">\n    <p class="guestExperienceEyebrow">REAL EVENT EXPERIENCE</p>\n    <h2 class="guestExperienceTitle" id="guest-experience-title">Made for the Moments Everyone Remembers.</h2>\n    <p class="guestExperienceIntro">Real backyard setups, live cooking and interactive hibachi entertainment — brought right to your event.</p>\n    <div class="guestExperienceGrid">\n      <article class="guestExperienceCard">\n        <img src="/assets/guest-experience-chef.webp" alt="Hibachi chef entertaining guests at a backyard party" loading="lazy" width="360" height="640">\n        <div class="guestExperienceBody">\n          <div class="guestExperienceStars" aria-hidden="true">★★★★★</div>\n          <p class="guestExperienceLabel">THE HIBACHI EXPERIENCE</p>\n          <h3>Dinner, Fire &amp; Fun — Right in Your Backyard</h3>\n          <p>Fresh hibachi cooked on-site with an interactive chef experience that turns dinner into part of the celebration.</p>\n        </div>\n      </article>\n      <article class="guestExperienceCard">\n        <img src="/assets/guest-experience-party.webp" alt="Backyard setup for a private hibachi party" loading="lazy" width="360" height="640">\n        <div class="guestExperienceBody">\n          <div class="guestExperienceStars" aria-hidden="true">★★★★★</div>\n          <p class="guestExperienceLabel">MADE FOR CELEBRATIONS</p>\n          <h3>Your Backyard. Your Private Hibachi Party.</h3>\n          <p>From birthdays to family gatherings, we bring the grill, food and entertainment directly to your event.</p>\n        </div>\n      </article>\n    </div>\n  </div>\n</section>\n\n'''
          if 'id="guest-experience"' not in s:
              anchor='<section class="how" aria-labelledby="how-title">'
              assert anchor in s, 'How It Works section anchor not found'
              s=s.replace(anchor,module+anchor,1)

          p.write_text(s)
          PY

      - name: Clean temporary files and commit
        run: |
          rm -rf .tmp
          rm -f assets/guest-experience-backyard.jpg
          rm -f .github/workflows/add-home-experience.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add homepage real event experience gallery"
          git push
