name: Remove homepage Chicago-only SEO block

on:
  push:
    paths:
      - '.github/workflows/remove-home-chicago-seo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Chicago-only homepage block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          block = '''<section class="localSeo" aria-labelledby="local-seo-title">
  <div class="localSeoWrap">
    <p class="mini">CHICAGO HIBACHI CATERING</p>
    <h2 id="local-seo-title">Chicago Is Our Core Service Area</h2>
    <p>We serve Chicago and Chicagoland, plus selected events in Indiana, Michigan, Wisconsin, Southern California and Florida based on date and availability.</p>
  </div>
</section>

'''
          if block not in s:
              raise SystemExit('Target block not found; no changes made')
          p.write_text(s.replace(block, '', 1))
          PY
      - name: Commit change and remove one-time workflow
        run: |
          rm .github/workflows/remove-home-chicago-seo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-home-chicago-seo.yml
          git commit -m "Remove Chicago-only SEO block from homepage"
          git push
