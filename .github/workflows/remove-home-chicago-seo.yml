name: Remove homepage Chicago-only SEO block

on:
  push:
    paths:
      - '.github/workflows/remove-home-chicago-seo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Chicago-only homepage block
        run: python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); n=re.sub(r'<section class=\"localSeo\" aria-labelledby=\"local-seo-title\">.*?</section>\s*', '', s, count=1, flags=re.S); assert n != s, 'Target block not found'; p.write_text(n)"
      - name: Commit change and remove one-time workflow
        run: |
          rm .github/workflows/remove-home-chicago-seo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-home-chicago-seo.yml
          git commit -m "Remove Chicago-only SEO block from homepage"
          git push
