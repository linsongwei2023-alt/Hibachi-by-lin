name: Update homepage multi-region copy

on:
  push:
    paths:
      - '.github/workflows/home-multiregion-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage copy and service areas link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            'Chicago &amp; Midwest':'Multiple service areas',
            'Chicago & Midwest':'Multiple service areas',
            'Chicago Mobile Hibachi in 3 Simple Steps':'Mobile Hibachi in 3 Simple Steps',
            'Chicago, Chicagoland and surrounding Midwest events.':'From booking to your backyard, we make private mobile hibachi simple.'
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          marker='<p class="travelNote">Travel fees vary by event location and will be confirmed with you before your booking is finalized.</p>'
          link='<p style="text-align:center;margin:14px 0 0"><a href="/areas-we-serve" style="color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:4px">Explore All Service Areas →</a></p>'
          assert marker in s, 'Service area travel note not found'
          if 'Explore All Service Areas' not in s:
              s=s.replace(marker, marker+link, 1)
          p.write_text(s)
          PY
      - name: Commit update and remove workflow
        run: |
          rm .github/workflows/home-multiregion-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/home-multiregion-copy.yml
          git commit -m "Make homepage multi-region messaging consistent"
          git push
