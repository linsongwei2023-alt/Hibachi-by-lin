name: Disable double tap zoom sitewide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-double-tap-sitewide.yml'

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Disable double tap zoom on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          rule = '<style id="hbl-no-double-tap">html,body,*{touch-action:manipulation}</style>'
          changed = []

          for p in Path('.').glob('*.html'):
              s = p.read_text()
              new = re.sub(
                  r'<style id=["\']hbl-no-double-tap["\']>.*?</style>',
                  rule,
                  s,
                  count=1,
                  flags=re.S,
              )
              if new == s and '</head>' in s:
                  new = s.replace('</head>', rule + '\n</head>', 1)
              if new != s:
                  p.write_text(new)
                  changed.append(p.name)

          print('Updated:', ', '.join(changed))
          PY
      - name: Commit sitewide touch fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Disable double tap zoom across all pages'
          git push origin main
