name: Upgrade homepage experience images

on:
  push:
    paths:
      - '.github/workflows/upgrade-home-experience-images.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild high quality event photos
        run: |
          cat .tmp/hq-chef-0.b64 .tmp/hq-chef-1.b64 | tr -d '\n\r' | base64 -d > assets/guest-experience-chef.webp
          cat .tmp/hq-party.b64 | tr -d '\n\r' | base64 -d > assets/guest-experience-party.webp
          test $(wc -c < assets/guest-experience-chef.webp) -gt 150000
          test $(wc -c < assets/guest-experience-party.webp) -gt 80000

      - name: Commit high quality images and clean staging
        run: |
          rm -rf .tmp
          rm .github/workflows/upgrade-home-experience-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade homepage event photo quality"
          git push
