name: Expand English Notes diary boxes
on:
  push:
    paths:
      - '.github/workflows/english-notes-autogrow.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-notes-coach-v2
      - name: Make diary boxes large and auto-growing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('english-notes-coach/index.html')
          s=p.read_text()
          s=s.replace('textarea{min-height:320px;resize:vertical}.diaryBox{min-height:360px}', 'textarea{min-height:320px;resize:vertical}.diaryBox{min-height:520px;overflow:hidden;resize:none}')
          s=s.replace('.diaryBox{min-height:340px}', '.diaryBox{min-height:480px}')
          old="function showDiary(d){let x=dget(d);E.date.value=d;E.orig.value=x.original||'';E.rev.value=x.revised||''}"
          new="function autoGrow(x){x.style.height='auto';x.style.height=Math.max(x.scrollHeight,parseInt(getComputedStyle(x).minHeight)||0)+'px'}\nfunction growDiary(){autoGrow(E.orig);autoGrow(E.rev)}\nfunction showDiary(d){let x=dget(d);E.date.value=d;E.orig.value=x.original||'';E.rev.value=x.revised||'';requestAnimationFrame(growDiary)}"
          if old not in s: raise SystemExit('showDiary target not found')
          s=s.replace(old,new,1)
          old2="E.date.onchange=()=>showDiary(E.date.value);[E.orig,E.rev].forEach(x=>x.oninput=write);"
          new2="E.date.onchange=()=>showDiary(E.date.value);[E.orig,E.rev].forEach(x=>x.oninput=()=>{autoGrow(x);write()});"
          if old2 not in s: raise SystemExit('input target not found')
          s=s.replace(old2,new2,1)
          old3="document.documentElement.style.setProperty('--font',f[1]);localStorage.setItem(FS,f[0])}"
          new3="document.documentElement.style.setProperty('--font',f[1]);localStorage.setItem(FS,f[0]);requestAnimationFrame(growDiary)}"
          if old3 not in s: raise SystemExit('font target not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-notes-coach/index.html
          git commit -m "Make diary fields large and auto-growing"
          git rm .github/workflows/english-notes-autogrow.yml
          git commit -m "Remove one-time English Notes auto-grow workflow"
          git push origin HEAD:english-notes-coach-v2
