name: Normalize tax policy
on:
  push:
    paths:
      - '.github/workflows/normalize-tax-policy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply tax wording only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'index.html': [
              ('Payment is cash only. Your final quote will clearly show the food, add-ons, travel fee, applicable tax, deposit, and remaining balance.',
               'A 10.25% tax applies to every order regardless of payment method. Your final quote will clearly show the food, add-ons, travel fee, tax, deposit, and remaining balance. Tax is not included when calculating suggested gratuity.')
            ],
            'menu.html': [
              ('<b>FINAL CASH QUOTE</b><span>You will receive a final cash quote after we confirm your details.</span>',
               '<b>FINAL QUOTE</b><span>You will receive a final itemized quote after we confirm your details.</span>'),
              ('<b>CASH ONLY</b><span>We only accept cash on the day of your event.</span>',
               '<b>TAX</b><span>A 10.25% tax applies to every order regardless of payment method. Tax is excluded from suggested gratuity calculations.</span>')
            ],
            'book.html': [
              ('We confirm the complete itemized cash quote before requesting a $100 deposit.',
               'We confirm the complete itemized quote, including 10.25% tax, before requesting a $100 deposit.'),
              ('Travel and optional gratuity are confirmed by email. Cash only.',
               'A 10.25% tax applies to every order. Tax is excluded from suggested gratuity calculations.')
            ],
            'quote.html': [
              ('<span>Total price (Cash Only)</span>', '<span>Total price</span>'),
              ("'TOTAL PRICE (CASH ONLY)'", "'TOTAL PRICE'"),
              ('Cash total equals food, add-ons, travel, and tax. Suggested gratuity is based on the food subtotal only and excludes travel fee and tax.',
               'Total equals food, add-ons, travel, and 10.25% tax. Suggested gratuity is based on the food subtotal only and excludes travel fee and tax.'),
              ('Total cash price = food + add-ons + travel fee + tax.',
               'Total price = food + add-ons + travel fee + 10.25% tax.')
            ]
          }

          for filename, pairs in replacements.items():
            p = Path(filename)
            s = p.read_text()
            for old, new in pairs:
              if old not in s:
                raise SystemExit(f'Expected text not found in {filename}: {old[:80]}')
              s = s.replace(old, new)
            p.write_text(s)
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          rm .github/workflows/normalize-tax-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html menu.html book.html quote.html .github/workflows/normalize-tax-policy.yml
          git commit -m "Unify 10.25% tax policy across site"
          git push origin main
