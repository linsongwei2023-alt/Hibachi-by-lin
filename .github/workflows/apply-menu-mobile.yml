name: Apply menu mobile optimization
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-menu-mobile.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify controlled menu changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'menu.html';
          let html = fs.readFileSync(path, 'utf8');
          const original = html;
          const addonText = value => {
            const start = value.indexOf('04 · ADD-ONS');
            const end = value.indexOf('05 · IMPORTANT INFO');
            return value.slice(start, end).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          };
          const imageSources = value => [...value.matchAll(/<img\b[^>]*\bsrc="([^"]+)"/g)].map(match => match[1]);
          const oldGrid = '.addonGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}';
          const newGrid = '.addonGrid{display:grid;grid-template-columns:1fr;gap:0}\n.addonGrid>div:first-child .row:last-child{border-bottom:1px solid rgba(255,255,255,.08)}';
          const oldRow = '.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;color:#f4eee4} .row:last-child{border-bottom:0} .row b{color:var(--gold2);font-weight:900;white-space:nowrap}';
          const newRow = '.row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.35;color:#f4eee4} .row:last-child{border-bottom:0} .row span{min-width:0;overflow-wrap:anywhere} .row b{flex:0 0 auto;color:var(--gold2);font-weight:900;white-space:nowrap}';
          const cta = '.cta{padding:18px 0 34px} .cta a{display:flex;align-items:center;justify-content:center;height:54px;border-radius:3px;background:linear-gradient(180deg,#e0b55a,#d09a35);color:#171209;font-weight:900;letter-spacing:.04em;box-shadow:0 10px 22px rgba(0,0,0,.26)}';
          const breakpoint = '@media (min-width:600px){.addonGrid{grid-template-columns:1fr 1fr;gap:16px}.addonGrid>div:first-child .row:last-child{border-bottom:0}}';
          for (const marker of [oldGrid, oldRow, cta, '</head>']) {
            if (!html.includes(marker)) throw new Error('Expected menu marker missing');
          }
          html = html.replace(oldGrid, newGrid).replace(oldRow, newRow).replace(cta, cta + '\n' + breakpoint);
          if (!html.includes('/_vercel/insights/script.js')) {
            html = html.replace('</head>', '<script>\n  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };\n</script>\n<script defer src="/_vercel/insights/script.js"></script>\n</head>');
          }
          if (addonText(original) !== addonText(html)) throw new Error('Add-on content changed');
          if (JSON.stringify(imageSources(original)) !== JSON.stringify(imageSources(html))) throw new Error('Menu images changed');
          fs.writeFileSync(path, html);
          NODE
          git diff --check
          rm .github/workflows/apply-menu-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize menu mobile add-on layout"
          git push
