name: Harden booking date validation

on:
  push:
    paths:
      - '.github/workflows/harden-booking-date-validation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject past and same-day dates immediately
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('book.html')
          s = p.read_text()
          old = '''function validateBookingDate(form=document.getElementById('bookingForm')){const input=form?.querySelector('input[name="Event date"]');if(!input)return true;const minimum=chicagoTomorrow(),valid=/^\\d{4}-\\d{2}-\\d{2}$/.test(input.value)&&input.value>=minimum;input.min=minimum;input.setCustomValidity(valid?'':`Please choose ${minimum} or a later date. Same-day bookings are not available.`);return valid}'''
          new = '''function validateBookingDate(form=document.getElementById('bookingForm'),clearInvalid=false){const input=form?.querySelector('input[name="Event date"]');if(!input)return true;const minimum=chicagoTomorrow();input.min=minimum;if(!input.value){input.setCustomValidity('');return false}const valid=/^\\d{4}-\\d{2}-\\d{2}$/.test(input.value)&&input.value>=minimum;if(!valid&&clearInvalid){input.value='';input.setCustomValidity(`Please choose ${minimum} or a later date. Same-day and past dates are not available.`);input.reportValidity();return false}input.setCustomValidity(valid?'':`Please choose ${minimum} or a later date. Same-day and past dates are not available.`);return valid}'''
          if old not in s:
              raise SystemExit('validateBookingDate target not found')
          s = s.replace(old, new, 1)
          old2 = '''if(eventDate)eventDate.addEventListener('input',()=>validateBookingDate(form));'''
          new2 = '''if(eventDate){eventDate.min=chicagoTomorrow();eventDate.addEventListener('change',()=>validateBookingDate(form,true));eventDate.addEventListener('input',()=>{eventDate.min=chicagoTomorrow()})}'''
          if old2 not in s:
              raise SystemExit('eventDate listener target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/harden-booking-date-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html .github/workflows/harden-booking-date-validation.yml
          git commit -m "Reject past booking dates immediately"
          git push
