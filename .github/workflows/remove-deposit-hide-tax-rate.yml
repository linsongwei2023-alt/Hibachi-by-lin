name: Remove deposit and hide tax rate
on:
  push:
    paths:
      - '.github/workflows/remove-deposit-hide-tax-rate.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply policy cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f'Missing expected text in {path}: {old[:100]}')
                  return
              p.write_text(s.replace(old,new))

          # Homepage: no deposit; tax is disclosed without publishing the rate.
          replace('index.html',
            'After we confirm your event details and final quote, a $100 deposit is required to secure your booking. The remaining balance is due at the end of your event. A 10.25% tax applies to every order regardless of payment method. Your final quote will clearly show the food, add-ons, travel fee, tax, deposit, and remaining balance. Tax is not included when calculating suggested gratuity.',
            'After we confirm your event details and final quote, payment is due at the end of your event. Tax applies to every order. Your final quote will clearly show the food, add-ons, travel fee, tax, and total. Tax is not included when calculating suggested gratuity.')

          # Menu: disclose Tax only, no public percentage.
          replace('menu.html',
            'A 10.25% tax applies to every order regardless of payment method. Tax is excluded from suggested gratuity calculations.',
            'Tax applies to every order. Tax is excluded from suggested gratuity calculations.')

          # Booking: remove deposit language and public rate.
          replace('book.html',
            'Choose your event date and preferred time. We confirm the complete itemized quote, including 10.25% tax, before requesting a $100 deposit.',
            'Choose your event date and preferred time. We confirm the complete itemized quote, including tax, before your event.')
          replace('book.html',
            'A 10.25% tax applies to every order. Tax is excluded from suggested gratuity calculations.',
            'Tax applies to every order. Tax is excluded from suggested gratuity calculations.')
          replace('book.html',
            'Your request has been emailed to Hibachi by Lin. We will review it and contact you with the final itemized total and deposit instructions.',
            'Your request has been emailed to Hibachi by Lin. We will review it and contact you with the final itemized total.')
          replace('book.html',
            'Food estimate only. Travel and optional gratuity will appear in the itemized cash quote emailed before any deposit is requested.',
            'Food estimate only. Travel, tax, and optional gratuity will appear in the final itemized quote.')
          replace('book.html',
            'I understand this is a request only. My date is confirmed after the order is approved and the $100 deposit is received.',
            'I understand this is a request only. My date is confirmed after the order is reviewed and approved.')

          # Quote builder: keep internal TAX_RATE=.1025, but remove deposit from UI and calculations.
          replace('quote.html',
            "let p={adults:10,children:0,toddlers:0,adultProteins:{},childProteins:{},extras:{},filetUpgrade:0},travel=0,deposit=100,notes='',previewUrl='';const money=n=>`$${Number(n).toFixed(2)}`,TAX_RATE=.1025;",
            "let p={adults:10,children:0,toddlers:0,adultProteins:{},childProteins:{},extras:{},filetUpgrade:0},travel=0,notes='',previewUrl='';const money=n=>`$${Number(n).toFixed(2)}`,TAX_RATE=.1025;")
          replace('quote.html',
            "subtotal=foodSubtotal+(+travel||0),tax=subtotal*TAX_RATE,total=subtotal+tax,balance=Math.max(0,total-(+deposit||0));return{food,x,addonsTotal,filetTotal:legacyFiletTotal,proteinUpgradeTotal,foodSubtotal,subtotal,tax,total,balance}",
            "subtotal=foodSubtotal+(+travel||0),tax=subtotal*TAX_RATE,total=subtotal+tax;return{food,x,addonsTotal,filetTotal:legacyFiletTotal,proteinUpgradeTotal,foodSubtotal,subtotal,tax,total}")
          replace('quote.html',
            '<label>Deposit received ($)<input id="deposit" type="number" min="0" value="${deposit}"></label>',
            '')
          replace('quote.html',
            ";document.getElementById('deposit').oninput=e=>{deposit=+e.target.value||0;renderPreview()}",
            '')
          replace('quote.html',
            '<p><span>Deposit received</span><b>-${money(deposit)}</b></p><p><span>Balance due</span><b>${money(c.balance)}</b></p>',
            '')
          replace('quote.html',
            "<strong>${money(c.balance+tip)} after deposit</strong>",
            "<strong>${money(c.total+tip)} total</strong>")
          replace('quote.html',
            'Total equals food, add-ons, travel, and 10.25% tax. Suggested gratuity is based on the food subtotal only and excludes travel fee and tax.',
            'Total equals food, add-ons, travel, and tax. Suggested gratuity is based on the food subtotal only and excludes travel fee and tax.')
          replace('quote.html',
            "menu('Deposit received','',`-${money(deposit).slice(1)}`);menu('Balance after deposit','',money(m.balance));",
            '')
          replace('quote.html',
            "`Final: ${money(m.balance+tip)}`",
            "`Total: ${money(m.total+tip)}`")
          replace('quote.html',
            "x.fillText('Total price = food + add-ons + travel fee + 10.25% tax.',70,y);",
            "x.fillText('Total price = food + add-ons + travel fee + tax.',70,y);")

          # Hide any remaining customer-facing percentage text anywhere in HTML.
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              s=s.replace('10.25% tax','tax').replace('10.25% Tax','Tax')
              p.write_text(s)

          # Guardrails: no deposit language on customer/quote pages, no public percentage text.
          for name in ['index.html','menu.html','book.html','quote.html']:
              s=Path(name).read_text()
              if '10.25%' in s:
                  raise SystemExit(f'Public tax percentage remains in {name}')
          for name in ['index.html','book.html','quote.html']:
              s=Path(name).read_text().lower()
              if 'deposit' in s:
                  raise SystemExit(f'Deposit language remains in {name}')
          PY
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/remove-deposit-hide-tax-rate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html menu.html book.html quote.html .github/workflows/remove-deposit-hide-tax-rate.yml
          git commit -m "Remove deposit and simplify tax disclosure"
          git push origin main