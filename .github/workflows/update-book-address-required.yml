name: Update booking address flow
on:
  push:
    paths:
      - '.github/workflows/update-book-address-required.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking page
        run: python3 .github/scripts/finalize_book_address.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git commit -m "Use one autocomplete field for event address"
          git push
