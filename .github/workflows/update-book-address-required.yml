name: Update booking address flow
on:
  push:
    paths:
      - '.github/workflows/update-book-address-required.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve full address through all booking steps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('book.html'); s=p.read_text()
          old="""function summaryStrip(){const d=formDraft['Event date']||'Not set',t=formDraft['Preferred time']||'Not set',z=formDraft['City or ZIP']||'Not set';return `<div class=\"summaryStrip\"><div><small>Date</small><strong>${esc(d)}</strong></div><div><small>Time</small><strong>${esc(t)}</strong></div><div><small>Area</small><strong>${esc(z)}</strong></div></div>`}
function hiddenPrior(includeContact=false){let h=`<input type=\"hidden\" name=\"Event date\" value=\"${esc(formDraft['Event date'])}\"><input type=\"hidden\" name=\"Preferred time\" value=\"${esc(formDraft['Preferred time'])}\"><input type=\"hidden\" name=\"City or ZIP\" value=\"${esc(formDraft['City or ZIP'])}\">`;if(includeContact)h+=`<input type=\"hidden\" name=\"Customer name\" value=\"${esc(formDraft['Customer name'])}\"><input type=\"hidden\" name=\"Customer email\" value=\"${esc(formDraft['Customer email'])}\"><input type=\"hidden\" name=\"Customer phone number\" value=\"${esc(formDraft['Customer phone number'])}\">`;return h}"""
          new="""function summaryStrip(){const d=formDraft['Event date']||'Not set',t=formDraft['Preferred time']||'Not set',city=formDraft['Event city']||'',state=formDraft['Event state']||'',zip=formDraft['Event ZIP']||'',z=[city,state,zip].filter(Boolean).join(', ')||'Not set';return `<div class=\"summaryStrip\"><div><small>Date</small><strong>${esc(d)}</strong></div><div><small>Time</small><strong>${esc(t)}</strong></div><div><small>Area</small><strong>${esc(z)}</strong></div></div>`}
function hiddenPrior(includeContact=false){let h=`<input type=\"hidden\" name=\"Event date\" value=\"${esc(formDraft['Event date'])}\"><input type=\"hidden\" name=\"Preferred time\" value=\"${esc(formDraft['Preferred time'])}\"><input type=\"hidden\" name=\"Street address\" value=\"${esc(formDraft['Street address'])}\"><input type=\"hidden\" name=\"Event city\" value=\"${esc(formDraft['Event city'])}\"><input type=\"hidden\" name=\"Event state\" value=\"${esc(formDraft['Event state'])}\"><input type=\"hidden\" name=\"Event ZIP\" value=\"${esc(formDraft['Event ZIP'])}\">`;if(includeContact)h+=`<input type=\"hidden\" name=\"Customer name\" value=\"${esc(formDraft['Customer name'])}\"><input type=\"hidden\" name=\"Customer email\" value=\"${esc(formDraft['Customer email'])}\"><input type=\"hidden\" name=\"Customer phone number\" value=\"${esc(formDraft['Customer phone number'])}\">`;return h}"""
          if old not in s: raise SystemExit('old summary/hiddenPrior not found')
          s=s.replace(old,new,1)
          oldlead="fd.append('City or ZIP',formDraft['City or ZIP']||'');"
          newlead="fd.append('Street address',formDraft['Street address']||'');\n fd.append('Event city',formDraft['Event city']||'');\n fd.append('Event state',formDraft['Event state']||'');\n fd.append('Event ZIP',formDraft['Event ZIP']||'');"
          if oldlead not in s: raise SystemExit('old lead location not found')
          s=s.replace(oldlead,newlead,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git commit -m "Preserve full event address through booking steps"
          git push
