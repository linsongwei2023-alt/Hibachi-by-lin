name: Update booking address flow
on:
  push:
    paths:
      - '.github/workflows/update-book-address-required.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move full address to step 1 and require booking fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('book.html')
          s=p.read_text()

          old='''<label>City or ZIP<input name="City or ZIP" placeholder="Pasadena or 91101" required autocomplete="postal-code"></label><h3 class="formSection">Estimated guests</h3>'''
          new='''<h3 class="formSection">Full event address</h3><label>Street address<input name="Street address" placeholder="123 Main St" required autocomplete="street-address" id="eventAddress" inputmode="text"><div id="addressAutocompleteHost" class="addressAutocompleteHost"></div><div id="addressAutocompleteHelp" class="addressHelp">Start typing your street address.</div><input type="hidden" id="addressLat" name="Address latitude"><input type="hidden" id="addressLng" name="Address longitude"><input type="hidden" id="addressPlaceId" name="Google Place ID"></label><div class="fieldRow"><label>City<input name="Event city" placeholder="Fremont" required autocomplete="address-level2"></label><label>State<input name="Event state" placeholder="CA" required autocomplete="address-level1"></label></div><label>ZIP Code<input name="Event ZIP" placeholder="94539" required autocomplete="postal-code" inputmode="numeric" pattern="[0-9]{5}(-[0-9]{4})?"></label><h3 class="formSection">Estimated guests</h3>'''
          if old not in s:
              raise SystemExit('Step 1 City/ZIP block not found')
          s=s.replace(old,new,1)

          old3='''<h3 class="formSection">Event address</h3><label>Full event address<input name="Full event address" placeholder="Street, city, state, ZIP" required autocomplete="street-address" id="eventAddress" inputmode="text"><div id="addressAutocompleteHost" class="addressAutocompleteHost"></div><div id="addressAutocompleteHelp" class="addressHelp">Start typing your full event address.</div><input type="hidden" id="addressLat" name="Address latitude"><input type="hidden" id="addressLng" name="Address longitude"><input type="hidden" id="addressPlaceId" name="Google Place ID"></label><h3 class="formSection">Menu</h3>'''
          if old3 not in s:
              raise SystemExit('Step 3 address block not found')
          s=s.replace(old3,'''<h3 class="formSection">Menu</h3>''',1)

          # Address autocomplete now mounts in step 1, not step 3.
          s=s.replace('''if(window.mountHibachiAddressAutocomplete&&bookingStep===3)setTimeout(window.mountHibachiAddressAutocomplete,0);''','''if(window.mountHibachiAddressAutocomplete&&bookingStep===1)setTimeout(window.mountHibachiAddressAutocomplete,0);''')

          # Preserve all step-1 address fields when moving between steps.
          s=s.replace('''name="Full event address"''','''name="Street address"''')

          # Existing customer-entered fields are required. Optional extras remain optional by design because zero is a valid selection.
          # Menu can no longer be skipped: proteins are required according to guest counts.
          s=s.replace('''<label class="menuLater"><input id="menuLater" type="checkbox" ${menuLater?'checked':''}><span><b>Not sure about the menu yet?</b>You can submit the request now and finalize proteins later by text or email.</span></label>''','''<div class="tbdNotice" style="display:block">Please complete all included protein selections before submitting.</div>''')
          s=s.replace('''const menuBox=document.getElementById('menuLater');if(menuBox)menuBox.onchange=()=>{captureDraft();menuLater=menuBox.checked;if(menuLater){proteins.forEach(p=>{adultP[p]=0;childP[p]=0});filetUpgrade=0}render()};''','''menuLater=false;''')
          s=s.replace('''if(!menuLater&&(totalProtein(adultP)!==adults*2||totalProtein(childP)!==children)){''','''if(totalProtein(adultP)!==adults*2||totalProtein(childP)!==children){''')
          s=s.replace(''', or choose “Not sure about the menu yet?”.`''','''.`''')
          s=s.replace('''${!menuLater&&!complete?'<p class="fine">Choose all included protein servings, or select “Not sure about the menu yet?” above.</p>':''}''','''${!complete?'<p class="fine">Choose all included protein servings before submitting.</p>':''}''')

          # Make guest counts explicit required choices rather than relying only on defaults.
          # Adult count already defaults to the $500 minimum; children/toddlers may validly be zero.
          # Allergy Yes/No and conditional details are already required in the current form.

          p.write_text(s)
          PY
      - name: Record change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SITE_CHANGELOG.md')
          s=p.read_text()
          note='''\n## 2026-09-25 — Booking flow address cleanup\n\n- Moved the complete event address to Step 1: street, city, state and ZIP.\n- Removed duplicate event-address entry from Step 3.\n- Kept contact/date/time/address/allergy fields required and made protein selection required before submission.\n'''
          if '## 2026-09-25 — Booking flow address cleanup' not in s:
              p.write_text(s+note)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html SITE_CHANGELOG.md
          git commit -m "Simplify booking address flow and require selections"
          git push
