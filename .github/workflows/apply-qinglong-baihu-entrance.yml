name: Apply Qinglong Baihu entrance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-qinglong-baihu-entrance.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace entrance door carvings
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          lines=p.read_text().splitlines()
          dragon='''<div class="doorPanel doorLeft" aria-hidden="true"><svg class="doorEngraving guardianEngraving" viewBox="0 0 320 500" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="fine" d="M34 30h252M34 470h252M54 50h212M54 450h212"/><circle class="fine" cx="160" cy="250" r="116"/><circle class="fine" cx="160" cy="250" r="106"/><path d="M160 126c-24 0-43 14-54 35-22 1-40 15-47 35 14-8 27-9 39-4-20 15-31 37-30 62 10-13 21-21 34-24-9 22-7 47 6 68 4-17 12-30 24-39 1 29 12 55 28 73 16-18 27-44 28-73 12 9 20 22 24 39 13-21 15-46 6-68 13 3 24 11 34 24 1-25-10-47-30-62 12-5 25-4 39 4-7-20-25-34-47-35-11-21-30-35-54-35z"/><path d="M115 190q18-18 38 1-18 20-38 0zm90 0q-18-18-38 1 18 20 38 0z"/><circle cx="135" cy="191" r="5" fill="currentColor"/><circle cx="185" cy="191" r="5" fill="currentColor"/><path d="M145 218q15-13 30 0m-38 20q23 16 46 0m-38 24q15 12 30 0"/><path d="M113 171q-27-22-44-7 24 4 31 24m107-17q27-22 44-7-24 4-31 24M126 147q-16-31-35-30 17 15 18 39m85-9q16-31 35-30-17 15-18 39"/><path class="fine" d="M105 213q-31 5-47 27 27-8 48-1m108-26q31 5 47 27-27-8-48-1M108 274q-26 17-31 42 20-17 39-18m96-24q26 17 31 42-20-17-39-18M126 326q34 24 68 0M119 348q41 28 82 0"/></g></svg><span class="doorHandle"></span></div>'''
          tiger='''<div class="doorPanel doorRight" aria-hidden="true"><svg class="doorEngraving guardianEngraving" viewBox="0 0 320 500" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="fine" d="M34 30h252M34 470h252M54 50h212M54 450h212"/><circle class="fine" cx="160" cy="250" r="116"/><circle class="fine" cx="160" cy="250" r="106"/><path d="M111 153q-31-28-51-3 28 1 42 24m107-21q31-28 51-3-28 1-42 24"/><path d="M160 126c-43 0-78 34-78 86 0 31 12 52 29 68-5 39 15 75 49 92 34-17 54-53 49-92 17-16 29-37 29-68 0-52-35-86-78-86z"/><path d="M107 199q23-22 46 0-23 22-46 0zm106 0q-23-22-46 0 23 22 46 0z"/><circle cx="132" cy="199" r="5" fill="currentColor"/><circle cx="188" cy="199" r="5" fill="currentColor"/><path d="M145 231q15-11 30 0l-15 15z"/><path d="M160 246v17m0 0q-16 16-31 2m31-2q16 16 31 2M137 291q23 15 46 0"/><path d="M160 139v48m-21-43 10 39m32-39-10 39M111 163l26 24m72-24-26 24M96 225l34 8m94-8-34 8M101 252l31-3m87 3-31-3M112 284l25-17m71 17-25-17"/><path class="fine" d="M128 315q32 20 64 0M119 337q41 25 82 0M111 359q49 26 98 0"/></g></svg><span class="doorHandle"></span></div>'''
          intro='''<div class="introOverlay" id="introOverlay" role="dialog" aria-modal="true" aria-labelledby="introTitle">'''+dragon+tiger+'''<div class="introInner"><img class="introMark" src="/logo.png" alt=""><p class="introName" id="introTitle">HIBACHI BY LIN</p><div class="introLine" aria-hidden="true"></div><p class="introTag">PRIVATE HIBACHI · LIVE FIRE · YOUR PLACE</p><button class="introEnter" id="introEnter" type="button">START</button></div></div>'''
          found=False
          for i,line in enumerate(lines):
              if line.startswith('<div class="introOverlay"'):
                  lines[i]=intro
                  found=True
                  break
          if not found:
              raise SystemExit('introOverlay line not found')
          text='\n'.join(lines)+'\n'
          text=text.replace('.doorEngraving .fine{stroke-width:1.3;opacity:.72}', '.doorEngraving .fine{stroke-width:1.3;opacity:.72}.guardianEngraving{width:min(82%,410px);height:86%;opacity:.58}')
          p.write_text(text)
      - name: Commit and publish
        run: |
          git config user.name "Hibachi by Lin Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Carve Qinglong and Baihu guardians into entrance doors (2026-09-26)"
          git push origin main
