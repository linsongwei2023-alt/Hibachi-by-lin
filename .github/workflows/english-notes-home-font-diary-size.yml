name: Update English Notes diary size and font picker
on:
  push:
    branches: [english-notes-coach-v2]
    paths:
      - '.github/workflows/english-notes-home-font-diary-size.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-notes-coach-v2
      - name: Update layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('english-notes-coach/index.html')
          s=p.read_text()
          s=s.replace('header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}', 'header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}')
          s=s.replace('.status{font-size:12px;color:var(--muted);margin:8px 1px 14px}', '.status{font-size:12px;color:var(--muted);margin:8px 1px 10px}.fontBar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin:0 0 12px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}.fontBar label{margin:0;font-size:12px;color:var(--muted);white-space:nowrap}.fontBar select{padding:9px 10px;font-size:16px;background:#fafaf8}')
          s=s.replace('textarea{min-height:145px;resize:vertical}', 'textarea{min-height:320px;resize:vertical}.diaryBox{min-height:360px}')
          s=s.replace('@media(max-width:480px){.app{padding-top:16px}.card{padding:14px}h1{font-size:24px}.row{align-items:flex-start}.date{width:142px}.actions{flex-wrap:wrap}.actions .btn{flex:1 1 auto}.fontRow{grid-template-columns:1fr}}', '@media(max-width:480px){.app{padding-top:16px}.card{padding:14px}h1{font-size:24px}.row{align-items:flex-start}.date{width:142px}.actions{flex-wrap:wrap}.actions .btn{flex:1 1 auto}.fontRow{grid-template-columns:1fr}.diaryBox{min-height:340px}.fontBar{grid-template-columns:1fr}.fontBar label{margin-bottom:-4px}}')
          s=s.replace('<div id="status" class="status">● Ready</div>\n<div class="tabs">', '<div id="status" class="status">● Ready</div>\n<div class="fontBar"><label for="font">Writing font</label><select id="font" aria-label="Writing font"></select></div>\n<div class="tabs">')
          s=s.replace('<label>What I wrote</label><textarea id="orig" placeholder="Write freely. It saves automatically..."></textarea>', '<label>What I wrote</label><textarea id="orig" class="diaryBox" placeholder="Write freely. It saves automatically..."></textarea>')
          s=s.replace('<label>Natural American English</label><textarea id="rev" placeholder="Paste the revised version here..."></textarea>', '<label>Natural American English</label><textarea id="rev" class="diaryBox" placeholder="Paste the revised version here..."></textarea>')
          s=s.replace('  <div class="block"><div class="fontRow"><label for="font">Writing font</label><select id="font"></select></div><div id="fontPreview" class="preview">The quick brown fox jumps over the lazy dog.</div><p class="tiny">Fonts are free web fonts. Only the font you choose is loaded.</p></div>\n', '')
          s=s.replace(",font:q('font'),fontPreview:q('fontPreview')", ",font:q('font')")
          s=s.replace(";E.fontPreview.style.fontFamily=f[1]", "")
          if 'class="diaryBox"' not in s or 'class="fontBar"' not in s:
              raise SystemExit('Layout update verification failed')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-notes-coach/index.html
          git commit -m "Make diary editor larger and move font picker home"
          git rm .github/workflows/english-notes-home-font-diary-size.yml
          git commit -m "Remove one-time English Notes layout workflow"
          git push origin english-notes-coach-v2