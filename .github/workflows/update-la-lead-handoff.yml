name: Update LA lead handoff
on:
  push:
    paths:
      - '.github/workflows/update-la-lead-handoff.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking prefill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('book.html')
          book=p.read_text(encoding='utf-8')
          old=" restoreDraft();toggleAllergyDetails();bind();if(window.bindBookingValidation)window.bindBookingValidation();if(window.mountHibachiAddressAutocomplete)setTimeout(window.mountHibachiAddressAutocomplete,0);}}"
          new=" restoreDraft();applyLeadPrefill();toggleAllergyDetails();bind();if(window.bindBookingValidation)window.bindBookingValidation();if(window.mountHibachiAddressAutocomplete)setTimeout(window.mountHibachiAddressAutocomplete,0);}}"
          if old in book:
              book=book.replace(old,new,1)
          elif new not in book:
              raise SystemExit('render hook not found')
          fn='''function applyLeadPrefill(){
           const qs=new URLSearchParams(location.search);
           if(qs.get('source')!=='la-lead')return;
           let lead=null;
           try{lead=JSON.parse(sessionStorage.getItem('hblLeadPrefill')||'null')}catch(e){}
           if(!lead)return;
           const f=document.getElementById('bookingForm');
           if(!f)return;
           const set=(selector,value)=>{const el=f.querySelector(selector);if(el&&value){el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}))}};
           set('input[name="Event date"]',lead.date);
           set('select[name="Preferred time"]',lead.time);
           set('input[name="Customer name"]',lead.name);
           set('input[name="Customer email"]',lead.email);
           set('input[name="Customer phone number"]',lead.phone);
           sessionStorage.removeItem('hblLeadPrefill');
          }
          '''
          if 'function applyLeadPrefill()' not in book:
              marker='function toggleAllergyDetails(){'
              if marker not in book: raise SystemExit('toggle marker not found')
              book=book.replace(marker,fn+marker,1)
          p.write_text(book,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          if ! git diff --cached --quiet; then
            git commit -m "Prefill booking from LA lead form"
            git push
          fi
