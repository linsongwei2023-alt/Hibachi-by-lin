name: Remove homepage cash-only wording v2
on:
  push:
    paths:
      - '.github/workflows/remove-home-cash-only-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage payment wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<b>Simple booking</b><span>Cash only</span>'
          new = '<b>Simple booking</b><span>No payment online</span>'
          if old not in s:
              raise SystemExit('Expected homepage markup not found')
          s = s.replace(old, new, 1)
          if 'Cash only' in s:
              raise SystemExit('Cash-only wording still exists in homepage')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove cash-only wording from homepage"
          git rm .github/workflows/remove-home-cash-only-v2.yml
          git commit -m "Remove one-time homepage cleanup workflow"
          git push
