name: One-time conversion tune-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-conversion-tune.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply small conversion and SEO consistency updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # Homepage: compact the duplicate Chicago SEO section and make Chef Show a direct booking CTA.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".localSeo{background:#0a0908;border-top:1px solid rgba(217,171,74,.16);padding:34px 20px 38px}\n.localSeoWrap{max-width:820px;margin:0 auto;text-align:center}\n.localSeo .mini{margin:0 0 7px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.17em}\n.localSeo h2{margin:0;color:#fff;font:700 27px/1.12 Georgia,serif}\n.localSeo p{margin:12px auto 0;max-width:680px;color:var(--muted);font-size:13px;line-height:1.65}\n.localSeo a{display:inline-block;margin-top:14px;color:var(--gold2);font-size:13px;font-weight:900;text-decoration:underline;text-underline-offset:4px}\n@media(min-width:760px){.localSeo{padding:46px 28px 50px}.localSeo h2{font-size:36px}.localSeo p{font-size:14px}}"
          new_css = ".localSeo{background:#0a0908;border-top:1px solid rgba(217,171,74,.16);padding:25px 20px 28px}\n.localSeoWrap{max-width:820px;margin:0 auto;text-align:center}\n.localSeo .mini{margin:0 0 6px;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.17em}\n.localSeo h2{margin:0;color:#fff;font:700 25px/1.12 Georgia,serif}\n.localSeo p{margin:8px auto 0;max-width:720px;color:var(--muted);font-size:13px;line-height:1.55}\n@media(min-width:760px){.localSeo{padding:32px 28px 36px}.localSeo h2{font-size:32px}.localSeo p{font-size:14px}}"
          s = replace_once(s, old_css, new_css, 'homepage local SEO CSS')

          old_block = '''<section class="localSeo" aria-labelledby="local-seo-title">
  <div class="localSeoWrap">
    <p class="mini">CHICAGO HIBACHI CATERING</p>
    <h2 id="local-seo-title">A Private Hibachi Chef at Your Home</h2>
    <p>Hibachi by Lin brings mobile hibachi catering to homes, backyards, birthdays, family gatherings and private events across Chicago, Chicagoland and surrounding Midwest areas.</p>
    <p><strong>Serving Chicago &amp; the Midwest</strong><br>Illinois · Indiana · Michigan · Wisconsin</p>
    <a href="/areas-we-serve">EXPLORE OUR SERVICE AREAS →</a>
  </div>
</section>'''
          new_block = '''<section class="localSeo" aria-labelledby="local-seo-title">
  <div class="localSeoWrap">
    <p class="mini">CHICAGO HIBACHI CATERING</p>
    <h2 id="local-seo-title">Chicago Is Our Core Service Area</h2>
    <p>We serve Chicago and Chicagoland, plus selected events in Indiana, Michigan, Wisconsin, Los Angeles and Florida based on date and availability.</p>
  </div>
</section>'''
          s = replace_once(s, old_block, new_block, 'homepage local SEO block')

          s = replace_once(s, '.chefShow{background:linear-gradient(180deg,#080706 0%,#100d0a 50%,#080706 100%);border-top:1px solid rgba(217,171,74,.18);padding:44px 20px 50px}', '.chefShow{background:linear-gradient(180deg,#080706 0%,#100d0a 50%,#080706 100%);border-top:1px solid rgba(217,171,74,.18);padding:34px 20px 38px}', 'chef show mobile padding')
          s = replace_once(s, '.chefShowTitle{margin:0;color:#fff;font:700 34px/1.08 Georgia,serif}', '.chefShowTitle{margin:0;color:#fff;font:700 30px/1.08 Georgia,serif}', 'chef show title')
          s = replace_once(s, '.chefShowCopy{margin:12px auto 25px;max-width:620px;color:var(--muted);font-size:14px;line-height:1.6}', '.chefShowCopy{margin:9px auto 18px;max-width:620px;color:var(--muted);font-size:14px;line-height:1.55}', 'chef show copy spacing')
          s = replace_once(s, '.chefShowVideoFrame{width:min(100%,420px);margin:0 auto;', '.chefShowVideoFrame{width:min(88vw,360px);margin:0 auto;', 'chef show frame width')
          s = replace_once(s, '.chefShowBook{display:flex;align-items:center;justify-content:center;width:min(100%,320px);height:56px;margin:24px auto 0;', '.chefShowBook{display:flex;align-items:center;justify-content:center;width:min(100%,320px);height:52px;margin:18px auto 0;', 'chef show CTA spacing')
          s = replace_once(s, '  .chefShow{padding:62px 28px 68px}\n  .chefShowTitle{font-size:46px}\n  .chefShowCopy{margin-top:14px;margin-bottom:30px;font-size:16px}\n  .chefShowBook{height:58px;font-size:15px}', '  .chefShow{padding:46px 28px 50px}\n  .chefShowTitle{font-size:40px}\n  .chefShowCopy{margin-top:11px;margin-bottom:22px;font-size:16px}\n  .chefShowBook{height:54px;font-size:15px}', 'chef show desktop spacing')
          s = replace_once(s, '<a class="chefShowBook" href="/menu">VIEW MENU</a>', '<a class="chefShowBook" href="/book">BOOK YOUR PARTY</a>', 'chef show CTA')
          p.write_text(s, encoding='utf-8')

          # Menu: make shared-page SEO copy location-neutral.
          p = Path('menu.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '<title>Chicago Hibachi Catering Menu &amp; Pricing | Hibachi by Lin</title>', '<title>Mobile Hibachi Menu &amp; Pricing | Hibachi by Lin</title>', 'menu title')
          s = replace_once(s, '<meta name="description" content="View our Chicago mobile hibachi catering menu and pricing, including chicken, steak, shrimp, salmon, appetizers and add-ons for private events.">', '<meta name="description" content="View Hibachi by Lin mobile hibachi menu and pricing, including chicken, steak, shrimp, salmon, appetizers, add-ons and protein upgrades for private events.">', 'menu description')
          s = replace_once(s, '<meta property="og:title" content="Chicago Hibachi Catering Menu &amp; Pricing | Hibachi by Lin">', '<meta property="og:title" content="Mobile Hibachi Menu &amp; Pricing | Hibachi by Lin">', 'menu OG title')
          s = replace_once(s, '<meta property="og:description" content="View our Chicago mobile hibachi catering menu and pricing for private hibachi events.">', '<meta property="og:description" content="View our mobile hibachi menu and pricing for private events.">', 'menu OG description')
          p.write_text(s, encoding='utf-8')

          # Booking: make shared-page SEO copy location-neutral without touching booking logic.
          p = Path('book.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '<title>Book Mobile Hibachi Catering in Chicago | Hibachi by Lin</title>', '<title>Book Mobile Hibachi Catering | Hibachi by Lin</title>', 'book title')
          s = replace_once(s, '<meta name="description" content="Book a private hibachi chef at your home in Chicago. Choose your event date, guest count, proteins and add-ons for mobile hibachi catering.">', '<meta name="description" content="Book Hibachi by Lin for a private mobile hibachi event. Choose your date, service area, guest count, proteins and add-ons, then send your booking request.">', 'book description')
          s = replace_once(s, '<meta property="og:title" content="Book Mobile Hibachi Catering in Chicago | Hibachi by Lin">', '<meta property="og:title" content="Book Mobile Hibachi Catering | Hibachi by Lin">', 'book OG title')
          s = replace_once(s, '<meta property="og:description" content="Book a private hibachi chef at your home in Chicago for birthdays, backyard parties and private events.">', '<meta property="og:description" content="Request a private mobile hibachi chef for birthdays, backyard parties, family gatherings and private events.">', 'book OG description')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify protected booking and pricing logic remains present
        run: |
          grep -Fq "const proteins=['Chicken','Steak','Shrimp','Salmon','Upgrade to Filet Mignon +$5','Upgrade to Lobster Tail +$10']" book.html
          grep -Fq "let adults=10,children=0,toddlers=0" book.html
          grep -Fq "Adult (13+):</b> 2 protein servings per person." menu.html
          grep -Fq "Extra Chicken" menu.html
          grep -Fq "BOOK YOUR PARTY" index.html
          grep -Fq "Chicago Is Our Core Service Area" index.html

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-conversion-tune.yml
          git add index.html menu.html book.html
          git commit -m "Tune homepage conversion and shared page SEO"
          git push origin main
