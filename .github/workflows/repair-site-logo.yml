name: Repair site logo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-site-logo.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace malformed embedded logo
        shell: bash
        env:
          CLEAN_LOGO_BASE64: ""
        run: |
          printf '%s' "$CLEAN_LOGO_BASE64" | base64 --decode > logo.png
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const files = ['index.html', 'menu.html'];
          const addonText = value => {
            const start = value.indexOf('04 · ADD-ONS');
            const end = value.indexOf('05 · IMPORTANT INFO');
            return start >= 0 && end > start
              ? value.slice(start, end).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()
              : null;
          };
          for (const path of files) {
            const original = fs.readFileSync(path, 'utf8');
            const beforeAddon = addonText(original);
            let replacements = 0;
            const updated = original.replace(/(<img\s+src=")data:image\/png;base64,[^"]+(")/, (...args) => {
              replacements++;
              return args[1] + 'logo.png' + args[2];
            });
            if (replacements !== 1) throw new Error(path + ': expected exactly one logo replacement');
            if (beforeAddon !== addonText(updated)) throw new Error(path + ': add-on content changed');
            if (!updated.includes('src="logo.png"')) throw new Error(path + ': external logo reference missing');
            fs.writeFileSync(path, updated);
          }
          const logo = fs.readFileSync('logo.png');
          const png = Buffer.from([137,80,78,71,13,10,26,10]);
          if (logo.length < 1000 || !logo.subarray(0,8).equals(png)) throw new Error('Clean logo PNG validation failed');
          console.log('logo bytes=' + logo.length + ' sha256=' + crypto.createHash('sha256').update(logo).digest('hex'));
          NODE
          git diff --check
          rm .github/workflows/repair-site-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix site logo loading"
          git push
