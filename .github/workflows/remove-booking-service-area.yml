name: Remove booking service area field

on:
  push:
    paths:
      - '.github/workflows/remove-booking-service-area.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify booking location section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('book.html')
          s = p.read_text()

          old_meta = 'Choose your date, service area, guest count, proteins and add-ons, then send your booking request.'
          new_meta = 'Choose your date, enter your full event address, guest count, proteins and add-ons, then send your booking request.'
          if old_meta in s:
              s = s.replace(old_meta, new_meta, 1)

          cities = "const cities=['Chicago & Illinois','Indiana','Michigan','Wisconsin','Los Angeles','Florida'];\n"
          s = s.replace(cities, '', 1)

          service = '<label>Service area<select name="Service area" required><option value="" disabled selected>Select your area</option>${cities.map(c=>`<option>${c}</option>`).join(\'\')}</select></label>'
          if service not in s:
              raise SystemExit('Service area field not found; no booking changes made')
          s = s.replace(service, '', 1)

          p.write_text(s)
          PY
      - name: Commit booking cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git commit -m "Remove service area selector from booking form"
          git push
