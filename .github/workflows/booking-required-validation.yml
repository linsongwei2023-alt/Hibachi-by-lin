name: Booking required validation
on:
  push:
    paths:
      - '.github/workflows/booking-required-validation.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking validation
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git commit -m "Require complete booking fields with clear validation" || true
          git rm .github/workflows/booking-required-validation.yml
          git commit -m "Remove one-time booking validation workflow"
          git push
