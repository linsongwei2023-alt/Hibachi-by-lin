name: Booking required validation
on:
  push:
    paths:
      - '.github/workflows/booking-required-validation.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable clear validation reminders
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('book.html')
          s=p.read_text()
          old='''<button class="submit" type="submit" ${complete?'':'disabled'}>Send booking request →</button>'''
          new='''<button class="submit" type="submit">Send booking request →</button>'''
          if old not in s:
              raise SystemExit('Expected submit button pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html
          git commit -m "Show validation reminders for incomplete booking requests"
          git rm .github/workflows/booking-required-validation.yml
          git commit -m "Remove one-time booking validation workflow"
          git push
