name: Itemize protein upgrade charges in quote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hbl-quote-upgrade-itemization-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply quote itemization fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quote.html')
          s=p.read_text()
          old='<p><span>Add-ons</span><b>${money(c.addonsTotal)}</b></p>${(+p.filetUpgrade||0)>0?`<p><span>Filet Mignon Upgrade × ${p.filetUpgrade}</span><b>${money(c.filetTotal)}</b></p>`:\'\' }<p><span>Travel fee</span>'
          new='<p><span>Add-ons</span><b>${money(c.addonsTotal)}</b></p>${c.proteinUpgradeTotal>0?`<p><span>Protein upgrades</span><b>${money(c.proteinUpgradeTotal)}</b></p>`:\'\'}${(+p.filetUpgrade||0)>0?`<p><span>Filet Mignon Upgrade × ${p.filetUpgrade}</span><b>${money(c.filetTotal)}</b></p>`:\'\' }<p><span>Travel fee</span>'
          if s.count(old)!=1:
              raise SystemExit(f'preview itemization match count={s.count(old)}')
          s=s.replace(old,new,1)
          old2="(Array.isArray(proteins)?proteins:['Chicken','Steak','Shrimp','Salmon']).forEach(n=>{const a=p.adultProteins?.[n]||0,ch=p.childProteins?.[n]||0;if(a+ch)menu(`${n} protein`,`${a} adult + ${ch} child`,'Included')});"
          new2="(Array.isArray(proteins)?proteins:['Chicken','Steak','Shrimp','Salmon']).forEach(n=>{const a=p.adultProteins?.[n]||0,ch=p.childProteins?.[n]||0;if(a+ch){const qty=a+ch,isFilet=n==='Upgrade to Filet Mignon +$5',isLobster=n==='Upgrade to Lobster Tail +$10',label=(isFilet||isLobster)?n:`${n} protein`,amount=isFilet?money(qty*5):isLobster?money(qty*10):'Included';menu(label,`${a} adult + ${ch} child`,amount)}});"
          if s.count(old2)!=1:
              raise SystemExit(f'image protein row match count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          assert '<span>Protein upgrades</span>' in s
          assert "isLobster=n==='Upgrade to Lobster Tail +$10'" in s
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/hbl-quote-upgrade-itemization-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote.html .github/workflows/hbl-quote-upgrade-itemization-fix.yml
          git commit -m "Itemize protein upgrade charges in quote"
          git push origin main
