name: One-time mobile touch UX patch
# preview-branch trigger
on:
  push:
    branches: [fix-mobile-touch-sep11]
    paths:
      - .github/workflows/fix-mobile-touch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-mobile-touch-sep11
      - name: Patch city links and disable double-tap zoom
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '<style id="hbl-no-double-tap">html,body{touch-action:manipulation}</style>'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'hbl-no-double-tap' not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'Missing </head> in {path}')
                  text = text.replace('</head>', marker + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')

          links = {
              'hibachi-catering-wisconsin.html': {
                  'Milwaukee': '/hibachi-catering-milwaukee',
                  'Kenosha': '/hibachi-catering-kenosha',
                  'Racine': '/hibachi-catering-racine',
              },
              'hibachi-catering-indiana.html': {
                  'Hammond': '/hibachi-catering-hammond',
                  'Munster': '/hibachi-catering-munster',
                  'Crown Point': '/hibachi-catering-crown-point',
              },
              'hibachi-catering-michigan.html': {
                  'New Buffalo': '/hibachi-catering-new-buffalo',
                  'St. Joseph': '/hibachi-catering-st-joseph',
                  'South Haven': '/hibachi-catering-south-haven',
              },
          }
          for filename, cities in links.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for city, href in cities.items():
                  old = f'<div class="city">{city}</div>'
                  new = f'<a class="city" href="{href}" aria-label="View {city} hibachi service page">{city}</a>'
                  if old not in text and new not in text:
                      raise SystemExit(f'Expected city block not found: {filename} / {city}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Fix city links and mobile double-tap zoom" || exit 0
          git push origin HEAD:fix-mobile-touch-sep11
