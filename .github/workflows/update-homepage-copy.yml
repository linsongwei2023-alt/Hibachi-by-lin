name: Update homepage video copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-homepage-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage copy and buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '<h2 class="experienceTitle" id="experience-title">More Than Dinner. It’s a Show. 🔥</h2>',
                  '<h2 class="experienceTitle" id="experience-title">Fire, Flavor &amp; Live Hibachi.</h2>'
              ),
              (
                  '<a class="experienceBook" href="book.html">BOOK YOUR EVENT</a>',
                  '<a class="experienceBook" href="/menu">VIEW MENU</a>'
              ),
              (
                  '<a class="chefShowBook" href="/book">Book Your Hibachi Party</a>',
                  '<a class="chefShowBook" href="/menu">VIEW MENU</a>'
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/update-homepage-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-homepage-copy.yml
          git commit -m "Refine homepage video titles and menu CTAs"
          git push origin HEAD:main
