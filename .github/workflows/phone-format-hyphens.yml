name: Phone format hyphens
on:
  push:
    paths:
      - '.github/workflows/phone-format-hyphens.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update phone formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('la-check-availability.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('(213) 555-1234','213-555-1234')
          old="phone.addEventListener('input',()=>{phone.setCustomValidity('')});"
          new="phone.addEventListener('input',()=>{phone.setCustomValidity('');const digits=phone.value.replace(/\\D/g,'').slice(0,10);if(digits.length>=7)phone.value=`${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6,10)}`;else if(digits.length>=4)phone.value=`${digits.slice(0,3)}-${digits.slice(3)}`;else phone.value=digits});"
          if old not in s and new not in s:
              raise SystemExit('LA phone input handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('book.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('(312) 555-1234','312-555-1234')
          old="if(d.length>=7) phone.value=`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6,10)}`;\n      else if(d.length>=4) phone.value=`(${d.slice(0,3)}) ${d.slice(3)}`;\n      else if(d.length>0) phone.value=d;"
          new="if(d.length>=7) phone.value=`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6,10)}`;\n      else if(d.length>=4) phone.value=`${d.slice(0,3)}-${d.slice(3)}`;\n      else if(d.length>0) phone.value=d;"
          if old not in s and new not in s:
              raise SystemExit('Booking phone formatter not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add la-check-availability.html book.html
          if ! git diff --cached --quiet; then
            git commit -m "Use hyphen phone number format"
            git push
          fi
