name: One-time Chef Show end-screen fix

on:
  push:
    paths:
      - '.github/workflows/fix-chef-show-end-screen.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Chef Show return to poster after playback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<video class="chefShowVideo" controls playsinline preload="metadata" poster="assets/chef-show-poster.jpg" aria-label="Hibachi by Lin chef show and interactive entertainment">'
          new = '<video class="chefShowVideo" controls playsinline preload="metadata" poster="assets/chef-show-poster.jpg" onended="this.load()" aria-label="Hibachi by Lin chef show and interactive entertainment">'
          if new in s:
              print('Already fixed')
          elif old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('Updated Chef Show end behavior')
          else:
              raise SystemExit('Chef Show video tag not found')
          PY

      - name: Commit homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Fix Chef Show ending on black frame"
            git push origin main
          fi

      - name: Remove one-time workflow
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/fix-chef-show-end-screen.yml
          git add -A
          git commit -m "Remove one-time Chef Show end-screen workflow" || true
          git push origin main
