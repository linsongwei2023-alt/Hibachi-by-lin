name: Temporary Quote Layout Update

on:
  push:
    paths:
      - '.github/workflows/temp-quote-layout.yml'

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update quote layout
        run: python .github/scripts/temp_update_quote.py
      - name: Commit quote update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve generated quote readability and spacing"
          git push origin main
