name: Temporary homepage FAQ deposit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-faq-deposit.yml'

permissions:
  contents: write

jobs:
  fix-faq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update payment FAQ only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'After we confirm your event details and final quote, payment is due at the end of your event. Tax applies to every order. Your final quote will clearly show the food, add-ons, travel fee, tax, and total. Tax is not included when calculating suggested gratuity.'
          new = 'After we confirm your event details and final quote, a $100 deposit is required to secure your booking. The remaining balance is due at the end of your event. Tax applies to every order. Your final quote will clearly show the food, add-ons, travel fee, tax, and total. Tax is not included when calculating suggested gratuity.'
          if old not in s:
              raise SystemExit('Expected FAQ text not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix homepage payment FAQ deposit wording'
          git push origin main
