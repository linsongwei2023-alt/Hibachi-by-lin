name: Fix booking counter scroll jump

# Second push: workflow now exists on main, so this run can execute.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-booking-counter-scroll.yml'

permissions:
  contents: write

jobs:
  fix-booking-counter-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep booking counter position stable after taps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('book.html')
          s = p.read_text()

          marker = 'function bind(){'
          if marker not in s:
              raise SystemExit('Booking bind() function not found; no changes made.')

          helper = '''function stableCounterRender(anchor){
 const beforeTop=anchor.getBoundingClientRect().top;
 const groupKey=anchor.dataset.g||'';
 const proteinKey=anchor.dataset.p||'';
 const direction=anchor.dataset.d||'';
 const oldScroll=window.scrollY;
 render();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
   const selector=groupKey?'[data-g]':'[data-p]';
   const next=[...document.querySelectorAll(selector)].find(el=>
     (groupKey?el.dataset.g===groupKey:el.dataset.p===proteinKey)&&el.dataset.d===direction
   );
   if(next){
     const delta=next.getBoundingClientRect().top-beforeTop;
     if(Math.abs(delta)>0.5)window.scrollBy(0,delta);
   }else if(Math.abs(window.scrollY-oldScroll)>0.5){
     window.scrollTo(0,oldScroll);
   }
 }));
}
'''
          if 'function stableCounterRender(anchor)' not in s:
              s = s.replace(marker, helper + marker, 1)

          old1 = "else if(k.startsWith('extra:')){const n=k.slice(6);extraC[n]=Math.max(0,(extraC[n]||0)+d)}render()});document.querySelectorAll('[data-p]')"
          new1 = "else if(k.startsWith('extra:')){const n=k.slice(6);extraC[n]=Math.max(0,(extraC[n]||0)+d)}stableCounterRender(b)});document.querySelectorAll('[data-p]')"
          if old1 not in s:
              raise SystemExit('Guest/add-on counter render hook not found; no changes made.')
          s = s.replace(old1, new1, 1)

          old2 = "if(n==='Steak')clampFilet();render()});const f=document.getElementById('bookingForm')"
          new2 = "if(n==='Steak')clampFilet();stableCounterRender(b)});const f=document.getElementById('bookingForm')"
          if old2 not in s:
              raise SystemExit('Protein counter render hook not found; no changes made.')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix booking counter scroll jump on mobile'
          git push origin main
