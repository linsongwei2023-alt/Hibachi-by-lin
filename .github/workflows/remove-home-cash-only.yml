name: Remove homepage cash-only wording
on:
  push:
    paths:
      - '.github/workflows/remove-home-cash-only.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage payment wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'Simple booking — Cash only'
          new = 'Simple booking — No payment online'
          if old not in s:
              raise SystemExit('Expected homepage wording not found')
          s = s.replace(old, new, 1)
          if old in s:
              raise SystemExit('Old cash-only wording still present')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove cash-only wording from homepage"
          git rm .github/workflows/remove-home-cash-only.yml
          git commit -m "Remove one-time homepage cleanup workflow"
          git push
