<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Continue to Hibachi Availability | Hibachi by Lin</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#15120f">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#15120f;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .card{width:min(520px,calc(100% - 32px));padding:28px;background:#211d18;border:1px solid #ffffff18;border-radius:12px;text-align:center}
    img{width:62px;height:62px}.eyebrow{color:#f4b942;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin:12px 0}
    h1{font:700 32px/1.08 Georgia,serif;margin:0 0 12px}p{color:#c9c3b9;line-height:1.55}
    a{display:inline-block;margin-top:8px;background:#ee5428;color:#fff;text-decoration:none;padding:14px 18px;border-radius:6px;font-weight:800}
  </style>
  <script>
    (function(){
      const q=new URLSearchParams(location.search);
      if(!q.get('source'))q.set('source','google-la');
      const target='/book?'+q.toString();
      window.__hblTarget=target;
      location.replace(target);
    })();
  </script>
<link rel="stylesheet" href="/site-typography.css">
</head>
<body>
  <main class="card">
    <img src="/logo.png" alt="Hibachi by Lin">
    <div class="eyebrow">Los Angeles · Private Hibachi</div>
    <h1>Taking you to availability.</h1>
    <p>Start with your date, location and contact info. No payment or deposit is required.</p>
    <a id="continueLink" href="/book?source=google-la">Continue</a>
  </main>
  <script>document.getElementById('continueLink').href=window.__hblTarget||'/book?source=google-la';</script>
</body>
</html>
